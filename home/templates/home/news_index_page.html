<section id="news-list" class="py-20 bg-gray-50">
    <div class="max-w-7xl mx-auto px-6">
        <h2 class="text-3xl font-bold text-center mb-12">Latest News</h2>
        <div class="grid md:grid-cols-3 gap-8">
            {% for news in news_pages %}
                <div class="bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col">
                    {% if news.image %}
                        {% image news.image fill-600x400 as img %}
                        <img src="{{ img.url }}" alt="{{ news.title }}" class="w-full h-48 object-cover">
                    {% endif %}
                    <div class="p-6 flex-grow">
                        <p class="text-green-600 text-sm font-semibold mb-2">{{ news.publication_date|date:"M d, Y" }}</p>
                        <h3 class="font-bold text-xl mb-3 text-gray-900">{{ news.title }}</h3>
                        <p class="text-gray-600 text-sm mb-4">{{ news.body|striptags|truncatewords:20 }}</p>
                        <a href="{{ news.url }}" class="text-green-700 font-bold hover:underline">Read More →</a>
                    </div>
                </div>
            {% empty %}
                <p class="text-center text-gray-500 col-span-full">No news updates at this time.</p>
            {% endfor %}
        </div>
    </div>
</section>
